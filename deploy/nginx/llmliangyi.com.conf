# 放到服务器 /etc/nginx/sites-available/llmliangyi.com，再软链到 sites-enabled
# 证书从腾讯云「SSL 证书」下载 Nginx 格式，放到 /etc/nginx/ssl/ 下

server {
    listen 80;
    listen [::]:80;
    server_name llmliangyi.com www.llmliangyi.com;
    return 301 https://llmliangyi.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.llmliangyi.com;

    ssl_certificate     /etc/nginx/ssl/llmliangyi.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/llmliangyi.com.key;

    return 301 https://llmliangyi.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name llmliangyi.com;

    ssl_certificate     /etc/nginx/ssl/llmliangyi.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/llmliangyi.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/llmliangyi;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /memes/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
