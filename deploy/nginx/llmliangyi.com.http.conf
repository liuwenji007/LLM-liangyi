# 证书到位之前的临时配置：只有 HTTP。证书放好后换成 llmliangyi.com.conf

server {
    listen 80;
    listen [::]:80;
    server_name www.llmliangyi.com;
    return 301 http://llmliangyi.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name llmliangyi.com;

    root /var/www/llmliangyi;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /memes/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
