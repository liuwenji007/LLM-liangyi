title: Tay 上线不到一天就被带偏
summary: 微软在 Twitter 放出聊天机器人 Tay，让它模仿年轻用户的说法。用户很快用重复和诱导把它带到种族歧视言论上。Tay 在上线后不到 24 小时下线。
