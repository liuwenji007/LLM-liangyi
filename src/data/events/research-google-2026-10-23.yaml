title: Google 举办 Research@ 2026，公布十项 AI 研究进展
summary: "Google 在总部山景城举行的 Research@ 2026 活动上，系统公布十项研究进展，涉及医疗 AI（AMIE）、地球与公共卫生 AI（Earth AI）、太空计算（Project Suncatcher）、多智能体编排、边缘 AI 芯片等方向。当前采集页为官方聚合/摘要卡片，完整条目待绑定 Google Research 官方博文《Research@ 2026: 10 ways we're amplifying human ingenuity》。"
