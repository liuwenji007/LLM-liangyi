name: 候选线索
description: 手动补一条待粗分的链接。脚本开出的候选用同一套字段。
title: "候选："
body:
  - type: markdown
    attributes:
      value: |
        这是候选，不是已核实条目。维护者核对前不要把 `verified` 改成 true。
        自动收集会使用标签 `候选/编年`（每天最多 5 条）和 `候选/乐子`（每天最多 10 条）。
        维护者在评论里写 `/收`（待定时用 `/收 明` 或 `/收 暗`）会开草稿 PR，写 `/丢` 会关闭。只有仓库维护者有效。官网拒抓时，把卡片标题和摘要贴在 `/收` 下面。
  - type: input
    id: url
    attributes:
      label: 原文链接
      description: 正文里请保留一行 `source: 链接`，避免重复开 Issue。
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: 分级
      options:
        - 编年
        - 乐子
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: 建议面
      options:
        - 明史
        - 暗史
        - 待定
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 为什么值得看
      description: 一两句即可。乐子不要写成已核实事故。
    validations:
      required: true
