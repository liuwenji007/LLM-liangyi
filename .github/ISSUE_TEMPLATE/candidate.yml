name: 候选线索
description: 手动补一条待粗分的链接。脚本开出的候选用同一套字段。
title: "候选："
body:
  - type: markdown
    attributes:
      value: |
        这是候选，不是已核实条目。`collect` / `triage` / `draft` 不会把 `verified` 改成 true。
        自动收集只开 `候选/编年`（每天最多 5 条）。乐子只留在报告里，不开 Issue。
        维护者在评论里写 `/收`（待定时用 `/收 明` 或 `/收 暗`）会开草稿 PR。已有草稿时请新发一条 `/收`，编辑旧评论不会更新。写 `/丢` 会关闭，这条链接不会再开出来。只有仓库维护者有效。
        采集页只有摘要或官网拒抓时，在 `/收` 下面写 `来源: https://真站`，再贴标题和摘要。
        草稿 PR 上评论 `/核实`，检查通过后才把 `verified` 改成 true。合并不等于上线，还要本机 `pnpm deploy:server`。
  - type: input
    id: url
    attributes:
      label: 原文链接
      description: 正文里请保留一行 `source: 链接`，避免重复开 Issue。
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: 分级
      options:
        - 编年
        - 乐子
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: 建议面
      options:
        - 明史
        - 暗史
        - 待定
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 为什么值得看
      description: 一两句即可。乐子不要写成已核实事故。
    validations:
      required: true
