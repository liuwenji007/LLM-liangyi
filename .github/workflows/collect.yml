name: 主动收集

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: 时间窗，24h、7d 或 30d。定时运行固定为 7d
        required: false
        default: "7d"

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect --window "$WINDOW"
        env:
          WINDOW: ${{ github.event_name == 'schedule' && '7d' || inputs.window }}
      - run: pnpm triage
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - run: |
          cat reports/collect/candidates.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/collect/triage.md >> "$GITHUB_STEP_SUMMARY"
        if: always() && hashFiles('reports/collect/candidates.md') != ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect-candidates
          path: reports/collect/
          if-no-files-found: ignore
