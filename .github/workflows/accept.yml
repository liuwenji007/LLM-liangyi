name: 收候选

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: accept-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  accept:
    if: |
      (
        github.event.issue.pull_request == null &&
        (startsWith(github.event.comment.body, '/收') || startsWith(github.event.comment.body, '/丢'))
      ) || (
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/核实')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm accept
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
